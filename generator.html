<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Visualisation voyage CesiumJS</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }
    #toolbar {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
    }
    #toolbar textarea {
        width: 360px;
        height: 120px;
        font-size: 11px;
        border-radius: 6px;
        border: none;
        padding: 6px;
        resize: vertical;
    }
    #toolbar button {
        margin-top: 6px;
        padding: 6px 10px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        background: #3498db;
        color: white;
        font-size: 12px;
    }
    #cesiumContainer {
        width: 100%;
        height: 100%;
    }
</style>

<!-- CesiumJS (CDN) -->
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
</head>
<body>

<div id="toolbar">
    <div><strong>Visualisation de voyage CesiumJS</strong></div>
    <div style="margin-top:4px;">Colle ici le JSON généré par ton générateur :</div>
    <textarea id="inputJson" placeholder='{"titre":"Exemple","etapes":[...]}'>
{
    "titre": "Exemple voiture + avion",
    "etapes": [
        {
            "nom": "Genève",
            "typeEtape": "depart",
            "transport": "voiture",
            "lon": 6.1432,
            "lat": 46.2044,
            "lien": "",
            "photo": "",
            "couleur": "#f1c40f",
            "hauteurArc": 10000
        },
        {
            "nom": "Lausanne",
            "typeEtape": "arrivee",
            "transport": "voiture",
            "lon": 6.6323,
            "lat": 46.5197,
            "lien": "",
            "photo": "",
            "couleur": "#f1c40f",
            "hauteurArc": 10000
        },
        {
            "nom": "Paris CDG",
            "typeEtape": "arrivee",
            "transport": "avion",
            "lon": 2.55,
            "lat": 49.0097,
            "lien": "",
            "photo": "",
            "couleur": "#3498db",
            "hauteurArc": 400000
        }
    ]
}
    </textarea>
    <br>
    <button onclick="chargerDepuisTextarea()">Charger le voyage</button>
</div>

<div id="cesiumContainer"></div>

<script>
// ===================== CONFIG CESIUM =====================

window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/";

const viewer = new Cesium.Viewer("cesiumContainer", {
    timeline: false,
    animation: false,
    geocoder: false,
    homeButton: true,
    sceneModePicker: true,
    baseLayerPicker: true,
    navigationHelpButton: false,
    infoBox: true,
    selectionIndicator: true
});

// ===================== ROUTE VOITURE (API) =====================

// ⚠️ Mets ici ta clé OpenRouteService
const ORS_KEY = "TA_CLE_ICI";

// 1. Récupérer la route réelle (virages, rond-points, etc.)
async function getRouteVoiture(startLon, startLat, endLon, endLat) {
    const url = "https://api.openrouteservice.org/v2/directions/driving-car/geojson";

    const body = {
        coordinates: [
            [startLon, startLat],
            [endLon, endLat]
        ]
    };

    const res = await fetch(url, {
        method: "POST",
        headers: {
            "Authorization": ORS_KEY,
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

    if (!res.ok) {
        console.error("Erreur OpenRouteService", await res.text());
        throw new Error("Erreur OpenRouteService");
    }

    const data = await res.json();
    return data.features[0].geometry.coordinates;
}

// 2. Récupérer l'altitude pour chaque point
async function getElevations(coords) {
    const url = "https://api.opentopodata.org/v1/etopo1";

    const locations = coords.map(c => `${c[1]},${c[0]}`).join("|");

    const res = await fetch(`${url}?locations=${locations}`);
    if (!res.ok) {
        console.error("Erreur OpenTopoData", await res.text());
        throw new Error("Erreur OpenTopoData");
    }

    const data = await res.json();
    return data.results.map(r => r.elevation);
}

// 3. Construire une polyline 3D Cesium
async function build3DRoute(start, end) {
    const route = await getRouteVoiture(start.lon, start.lat, end.lon, end.lat);
    const elevations = await getElevations(route);

    let positions = [];
    for (let i = 0; i < route.length; i++) {
        const lon = route[i][0];
        const lat = route[i][1];
        const h = elevations[i];
        positions.push(lon, lat, h);
    }
    return positions;
}

// ===================== TRAJET CESIUM (UNIVERSAL) =====================

async function tracerTrajetCesium(etapeDepart, etapeArrivee) {

    // 🚗 CAS SPÉCIAL : voiture → route réelle
    if (etapeDepart.transport === "voiture") {
        try {
            const positions3D = await build3DRoute(
                { lon: etapeDepart.lon, lat: etapeDepart.lat },
                { lon: etapeArrivee.lon, lat: etapeArrivee.lat }
            );

            viewer.entities.add({
                polyline: {
                    positions: Cesium.Cartesian3.fromDegreesArrayHeights(positions3D),
                    width: 4,
                    material: Cesium.Color.fromCssColorString(etapeDepart.couleur || "#f1c40f"),
                    clampToGround: false
                }
            });
        } catch (e) {
            console.error("Erreur route voiture, fallback arc simple", e);
            // fallback : arc classique
            tracerArcSimple(etapeDepart, etapeArrivee);
        }
        return;
    }

    // ✈️🚢🚄🚶 Tous les autres transports → arc classique
    tracerArcSimple(etapeDepart, etapeArrivee);
}

function tracerArcSimple(etapeDepart, etapeArrivee) {
    const couleur = etapeDepart.couleur || "#3498db";
    const hauteur = etapeDepart.hauteurArc || 50000;

    viewer.entities.add({
        polyline: {
            positions: Cesium.Cartesian3.fromDegreesArrayHeights([
                etapeDepart.lon, etapeDepart.lat, hauteur,
                etapeArrivee.lon, etapeArrivee.lat, hauteur
            ]),
            width: 4,
            material: Cesium.Color.fromCssColorString(couleur),
            clampToGround: false
        }
    });
}

// ===================== AFFICHAGE DU VOYAGE =====================

async function afficherVoyageCesium(voyage) {
    viewer.entities.removeAll();

    const etapes = voyage.etapes || [];
    if (etapes.length === 0) {
        alert("Aucune étape dans ce voyage.");
        return;
    }

    // Points (billboards)
    etapes.forEach(e => {
        if (e.lat == null || e.lon == null) return;

        viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(e.lon, e.lat),
            point: {
                pixelSize: 8,
                color: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.fromCssColorString(e.couleur || "#e74c3c"),
                outlineWidth: 2
            },
            label: {
                text: e.nom || "",
                font: "14px sans-serif",
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 2,
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                pixelOffset: new Cesium.Cartesian2(0, -18)
            }
        });
    });

    // Trajets entre étapes successives
    for (let i = 0; i < etapes.length - 1; i++) {
        const a = etapes[i];
        const b = etapes[i + 1];

        if (a.lat == null || a.lon == null || b.lat == null || b.lon == null) continue;

        await tracerTrajetCesium(a, b);
    }

    // Zoom sur l'ensemble
    viewer.zoomTo(viewer.entities);
}

// ===================== UI : CHARGER DEPUIS TEXTAREA =====================

function chargerDepuisTextarea() {
    const txt = document.getElementById("inputJson").value.trim();
    if (!txt) {
        alert("Colle un JSON de voyage dans la zone de texte.");
        return;
    }

    let data;
    try {
        data = JSON.parse(txt);
    } catch (e) {
        alert("JSON invalide : " + e.message);
        return;
    }

    afficherVoyageCesium(data);
}

// ===================== AUTO-CHARGEMENT EXEMPLE =====================

window.addEventListener("load", () => {
    chargerDepuisTextarea();
});
</script>

</body>
</html>
