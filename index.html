<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Globe 3D - Voyages</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.113/Build/Cesium/Cesium.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #cesiumContainer {
            position: absolute;
            inset: 0;
        }

        #menuVoyages {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.90);
            padding: 10px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
            max-width: 260px;
            max-height: 260px;
            overflow-y: auto;
            z-index: 9999;
        }

        .voyage-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 6px;
            font-size: 13px;
        }

        .miniature {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #ccc;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #333;
            display: inline-block;
        }

        .center-btn {
            cursor: pointer;
            font-size: 16px;
            margin-left: auto;
        }

        .cesium-infoBox-description img {
            max-width: 300px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<div id="cesiumContainer"></div>

<div id="menuVoyages">
    <h3 style="margin:0 0 6px 0; color:#2c3e50; font-size:15px; cursor:pointer;" onclick="toggleMenu()">
        📌 Voyages chargés ▼
    </h3>

    <div id="voyagesList"></div>

    <button onclick="cocherTout()" style="margin-top:6px;">Cocher tout</button>
    <button onclick="decocherTout()" style="margin-top:6px;">Décocher tout</button>
</div>

<script>
// === Cesium Token ===
Cesium.Ion.defaultAccessToken =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI4ZTM1MmNkZS0xYTc1LTQ1YTUtYWM5OS00MjgzZmQwMTI5ZDEiLCJpZCI6NDI4ODQ0LCJzdWIiOiJDYXJ5bCIsImlzcyI6Imh0dHBzOi8vaW9uLmNlc2l1bS5jb20iLCJhdWQiOiJDYXJ5bF9kZWZhdWx0IiwiaWF0IjoxNzc4MjU1NjY3fQ.-mKoiaV9CyenZUBr54_v-xo3MLWiWrWWXK7L5_-ZHvE";

// === Charger les voyages JSON ===
async function chargerVoyages() {
    const apiUrl = "https://api.github.com/repos/carylloca/Destinations/contents/voyages";
    const response = await fetch(apiUrl);
    const files = await response.json();

    const voyages = [];
    for (const file of files.filter(f => f.name.endsWith(".json"))) {
        const txt = await fetch(file.download_url).then(r => r.text());
        try { voyages.push(JSON.parse(txt)); } catch {}
    }
    return voyages;
}

let voyages = [];
let groupesCesium = [];

// === Générer icône numérotée ===
function creerIconeNumero(numero, couleur) {
    const size = 42;
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d");

    // Cercle
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - 3, 0, Math.PI * 2);
    ctx.fillStyle = couleur;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();

    // Numéro
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(numero, size/2, size/2);

    return canvas.toDataURL();
}

// === Interface ===
function couleurStableDepuisTexte(texte) {
    let hash = 0;
    for (let i = 0; i < texte.length; i++)
        hash = texte.charCodeAt(i) + ((hash << 5) - hash);
    return `hsl(${Math.abs(hash) % 360}, 65%, 55%)`;
}

function initialiserInterface() {
    const listeDiv = document.getElementById("voyagesList");

    voyages.forEach((v, index) => {
        let miniature = v.etapes.find(e => e.photo);
        let img = miniature ? miniature.photo : "https://placehold.co/32x32?text=📍";

        const div = document.createElement("div");
        div.className = "voyage-item";

        div.innerHTML = `
            <img src="${img}" class="miniature">
            <span class="color-dot" style="background:${v.couleurVoyage}"></span>
            <label>
                <input type="checkbox" onchange="toggleVoyage(${index}, this.checked)" checked>
                ${v.titre}
            </label>
            <span class="center-btn" onclick="centrerVoyage(${index})">📍</span>
        `;

        listeDiv.appendChild(div);
    });
}

function toggleMenu() {
    const div = document.getElementById("voyagesList");
    div.style.display = div.style.display === "none" ? "block" : "none";
}

function cocherTout() {
    document.querySelectorAll("#voyagesList input[type=checkbox]").forEach((cb, i) => {
        cb.checked = true;
        afficherVoyage(i);
    });
}

function decocherTout() {
    document.querySelectorAll("#voyagesList input[type=checkbox]").forEach((cb, i) => {
        cb.checked = false;
        masquerVoyage(i);
    });
}

// === Cesium Viewer ===
const viewer = new Cesium.Viewer("cesiumContainer", {
    terrain: Cesium.Terrain.fromWorldTerrain(),
    animation: false,
    timeline: false,
    geocoder: false,
    sceneModePicker: false,
    navigationHelpButton: false,
    baseLayerPicker: true,
    infoBox: true
});

// === OSRM Route ===
async function getRouteVoiture(lon1, lat1, lon2, lat2) {
    const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("OSRM");
    const data = await res.json();
    if (!data.routes || !data.routes[0]) throw new Error("OSRM");
    return data.routes[0].geometry.coordinates;
}

// === Affichage des voyages ===
function afficherTousLesVoyages() {
    voyages.forEach((_, i) => afficherVoyage(i));
}

function toggleVoyage(index, afficher) {
    if (afficher) afficherVoyage(index);
    else masquerVoyage(index);
}

async function afficherVoyage(index) {
    const voyage = voyages[index];
    const groupe = [];
    let last = null;

    for (let i = 0; i < voyage.etapes.length; i++) {
        const etape = voyage.etapes[i];

        const pos = Cesium.Cartesian3.fromDegrees(etape.lon, etape.lat, 2000);
        const icone = creerIconeNumero(i+1, voyage.couleurVoyage);

        const point = viewer.entities.add({
            position: pos,
            billboard: {
                image: icone,
                scale: 0.7,
                verticalOrigin: Cesium.VerticalOrigin.CENTER
            },
            description: `
                <h2>Étape ${i+1}</h2>
                ${etape.photo ? `<img src="${etape.photo}" style="width:100%;border-radius:8px;margin-bottom:10px;">` : ""}
                ${etape.lien ? `<p><a href="${etape.lien}" target="_blank">Lien externe</a></p>` : ""}
            `
        });

        groupe.push(point);

        if (last) {
            const hauteurArc = etape.hauteurArc || 300000;

            if (etape.transport === "voiture") {
                try {
                    const route = await getRouteVoiture(last.lon, last.lat, etape.lon, etape.lat);

                    const ligne = viewer.entities.add({
                        polyline: {
                            positions: Cesium.Cartesian3.fromDegreesArray(route.flat()),
                            width: 5,
                            clampToGround: true,
                            material: new Cesium.PolylineGlowMaterialProperty({
                                glowPower: 0.2,
                                color: Cesium.Color.fromCssColorString(voyage.couleurVoyage)
                            })
                        }
                    });

                    groupe.push(ligne);
                } catch {
                    const arc = arc3D(last.lon, last.lat, etape.lon, etape.lat, hauteurArc);
                    const ligne = viewer.entities.add({
                        polyline: {
                            positions: arc,
                            width: 5,
                            clampToGround: true,
                            material: new Cesium.PolylineGlowMaterialProperty({
                                glowPower: 0.2,
                                color: Cesium.Color.fromCssColorString(voyage.couleurVoyage)
                            })
                        }
                    });
                    groupe.push(ligne);
                }
            } else {
                const arc = arc3D(last.lon, last.lat, etape.lon, etape.lat, hauteurArc);
                const ligne = viewer.entities.add({
                    polyline: {
                        positions: arc,
                        width: 5,
                        clampToGround: true,
                        material: new Cesium.PolylineGlowMaterialProperty({
                            glowPower: 0.2,
                            color: Cesium.Color.fromCssColorString(voyage.couleurVoyage)
                        })
                    }
                });
                groupe.push(ligne);
            }
        }

        last = { lon: etape.lon, lat: etape.lat, transport: etape.transport };
    }

    groupesCesium[index] = groupe;
}

function masquerVoyage(index) {
    if (!groupesCesium[index]) return;
    groupesCesium[index].forEach(entite => viewer.entities.remove(entite));
    groupesCesium[index] = [];
}

// === Arc 3D ===
function arc3D(lon1, lat1, lon2, lat2, hauteur) {
    const p1 = Cesium.Cartesian3.fromDegrees(lon1, lat1);
    const p2 = Cesium.Cartesian3.fromDegrees(lon2, lat2);

    const cartesians = [];
    const steps = 64;

    for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const cart = Cesium.Cartesian3.lerp(p1, p2, t, new Cesium.Cartesian3());
        const carto = Cesium.Cartographic.fromCartesian(cart);
        carto.height = Math.sin(Math.PI * t) * hauteur;
        cartesians.push(Cesium.Cartesian3.fromRadians(carto.longitude, carto.latitude, carto.height));
    }

    return cartesians;
}

function centrerVoyage(index) {
    const voyage = voyages[index];
    let minLon = 999, maxLon = -999;
    let minLat = 999, maxLat = -999;

    voyage.etapes.forEach(e => {
        minLon = Math.min(minLon, e.lon);
        maxLon = Math.max(maxLon, e.lon);
        minLat = Math.min(minLat, e.lat);
        maxLat = Math.max(maxLat, e.lat);
    });

    viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees((minLon+maxLon)/2, (minLat+maxLat)/2, 2000000)
    });
}

// === Lancement ===
chargerVoyages().then(data => {
    voyages = data;
    voyages.forEach(v => v.couleurVoyage = couleurStableDepuisTexte(v.titre));
    initialiserInterface();
    afficherTousLesVoyages();
});
</script>

</body>
</html>
